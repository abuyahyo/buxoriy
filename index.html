<style>
/* SOFT MEDITATIVE — warm cream + sage + muted gold */
:root{
  --bg:#1f1a16;--surface:#2a231e;--surface2:#342c26;--surface3:#40362e;--border:#463a30;
  --text:#f5ecdb;--text-dim:#b8a890;--text-muted:#8a7c68;
  --sage:#8aa388;--sage-deep:#6d8a6a;--sage-glow:rgba(138,163,136,.18);
  --rose:#c8a098;--rose-soft:#b58a82;
  --gold:#d9b870;--gold-soft:#b89958;--gold-light:#e8d59a;--gold-dark:#b89958;
  --radius-sm:10px;--radius:18px;--radius-lg:28px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);
  --shadow:0 4px 16px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.08);
  --shadow-lg:0 12px 32px rgba(0,0,0,.20),0 6px 12px rgba(0,0,0,.10);
  --ease:cubic-bezier(.2,.8,.2,1);
}
.light{
  --bg:#faf3e7;--surface:#f5ecd6;--surface2:#efe5cb;--surface3:#e8dcb8;--border:#d7cdb1;
  --text:#2a2218;--text-dim:#5a4d3e;--text-muted:#8a7d68;
  --sage:#6d8a6a;--sage-deep:#4a6a48;--sage-glow:rgba(109,138,106,.14);
  --rose:#a07568;--rose-soft:#c89a90;
  --gold:#a87a2c;--gold-soft:#8a6520;--gold-light:#8a6520;--gold-dark:#6b5010;
  --shadow-sm:0 1px 3px rgba(70,50,20,.06),0 1px 2px rgba(70,50,20,.03);
  --shadow:0 4px 14px rgba(70,50,20,.08),0 2px 5px rgba(70,50,20,.05);
  --shadow-lg:0 12px 30px rgba(70,50,20,.12),0 6px 12px rgba(70,50,20,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-weight:400;min-height:100vh;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;touch-action:manipulation}
/* Search input — pill */
.search-wrap{position:relative}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-size:16px;padding:14px 46px 14px 20px;border-radius:var(--radius-lg);outline:none;transition:border-color .3s,background .3s,box-shadow .3s;box-shadow:var(--shadow-sm)}
.search-input:focus{border-color:var(--sage);box-shadow:0 0 0 4px var(--sage-glow),var(--shadow-sm)}
.search-input::placeholder{color:var(--text-muted);font-weight:300}
.search-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;font-size:14px;opacity:.7}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-muted);font-size:14px;width:30px;height:30px;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:color .25s,background .25s}
.search-clear:hover,.search-clear:active{color:var(--sage-deep);background:var(--surface2)}
.search-wrap.has-text .search-clear{display:flex}
.search-wrap.has-text .search-icon{display:none}

/* Breadcrumb */
.breadcrumb{position:sticky;top:0;z-index:50;padding:18px 20px 14px;border-bottom:1px solid var(--border);background:rgba(31,26,22,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.light .breadcrumb{background:rgba(250,243,231,.92)}
.breadcrumb .bc-trail{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.breadcrumb .bc-link{display:inline-block;cursor:pointer;color:var(--sage-deep);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:5px 13px;background:var(--sage-glow);border-radius:99px;transition:color .25s,background .25s,transform .2s;-webkit-tap-highlight-color:transparent}
.breadcrumb .bc-link:hover,.breadcrumb .bc-link:active{color:var(--text);background:var(--sage);transform:translateY(-1px)}
.breadcrumb .bc-sep{color:var(--text-muted);font-size:11px;margin:0 2px;opacity:.5}
.breadcrumb .bc-cur{font-size:20px;font-weight:400;color:var(--text);line-height:1.35;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;display:block;margin-top:4px;letter-spacing:-0.005em}
/* Hero */
.home-hero{text-align:center;padding:44px 20px 36px}
.home-title{font-size:30px;color:var(--text);margin-bottom:10px;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-weight:400;line-height:1.35;letter-spacing:-0.01em;animation:fadeUp .8s var(--ease) .1s both}
.home-sub{font-size:14px;color:var(--text-dim);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-style:italic;font-weight:300;letter-spacing:.03em;animation:fadeUp .8s var(--ease) .2s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hero-divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:24px auto 0;max-width:200px;color:var(--sage);opacity:.6;animation:fadeUp .8s var(--ease) .3s both}
.hero-divider .line{flex:1;height:1px;background:currentColor}
.hero-divider .dot{width:6px;height:6px;background:currentColor;border-radius:50%;transform:rotate(45deg)}
.home-search{max-width:560px;margin:36px auto 0;padding:0 20px}
.grid-wrap{padding:36px 18px 140px;max-width:1100px;margin:0 auto}
.grid-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;padding:0 4px}
.grid-label{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--text-muted);font-weight:500}
.grid-count{font-size:12px;color:var(--sage-deep);font-weight:500}
/* Kitob (book) cards */
.kitob-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:720px){.kitob-grid{grid-template-columns:1fr 1fr;gap:16px}}
.kitob-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:22px 22px;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s,background .25s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow-sm);content-visibility:auto;contain-intrinsic-size:auto 110px}
.kitob-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 0%,var(--sage-glow) 100%);opacity:0;transition:opacity .35s;pointer-events:none}
.kitob-card:hover,.kitob-card:active{transform:translateY(-3px);box-shadow:var(--shadow-lg);background:var(--surface3)}
.kitob-card:hover::before,.kitob-card:active::before{opacity:1}
.kitob-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;position:relative;z-index:1}
.kitob-num{font-size:11px;color:var(--sage-deep);letter-spacing:.15em;text-transform:uppercase;font-weight:600}
.kitob-name{font-size:17px;font-weight:500;color:var(--text);line-height:1.4;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;position:relative;z-index:1}
.kitob-stats{display:flex;gap:14px}
.kitob-stat{font-size:11px;color:var(--text-muted);font-weight:400}
.kitob-stat b{color:var(--text-dim);font-weight:600}
/* Bob (chapter) cards */
.bob-grid{display:grid;grid-template-columns:1fr;gap:12px}
.bob-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s,background .25s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow-sm);content-visibility:auto;contain-intrinsic-size:auto 90px}
.bob-card:hover,.bob-card:active{transform:translateY(-2px);box-shadow:var(--shadow);background:var(--surface3)}
.bob-num{font-size:10px;color:var(--sage-deep);letter-spacing:.14em;margin-bottom:6px;text-transform:uppercase;font-weight:600}
.bob-name{font-size:14px;font-weight:500;color:var(--text);line-height:1.55;margin-bottom:10px;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif}
.bob-count{font-size:11px;color:var(--text-muted)}
.bob-izoh{font-size:12px;color:var(--text-dim);line-height:1.75;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.bob-count b{color:var(--text-dim);font-weight:600}
/* Hadis list items */
.hadis-list{display:flex;flex-direction:column;gap:12px}
.hadis-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s,background .25s;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow-sm);content-visibility:auto;contain-intrinsic-size:auto 110px}
.hadis-item:hover,.hadis-item:active{transform:translateY(-2px);box-shadow:var(--shadow);background:var(--surface3)}
.hadis-item-num{font-size:10px;color:var(--sage-deep);letter-spacing:.14em;margin-bottom:8px;text-transform:uppercase;font-weight:600}
.hadis-item-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:8px;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif}
.hadis-item-preview{font-size:14px;color:var(--text);line-height:1.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:300}
.hadis-item-narrator{font-size:11px;color:var(--text-muted);margin-top:10px;font-style:italic;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif}
/* Hadis full page */
.hadis-text{padding:32px 14px 24px;margin:0 -6px 28px;line-height:1.95;color:var(--text);font-size:var(--hadis-fs,17px);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-weight:300;letter-spacing:.005em}
.hadis-izoh{padding:0 12px;line-height:1.85;color:var(--text-dim);font-size:calc(var(--hadis-fs,17px) - 1px);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-weight:300;margin-top:18px}
.hadis-arab{direction:rtl;text-align:right;font-family:system-ui,'Geeza Pro',sans-serif;font-size:calc(var(--hadis-fs,17px) + 8px);line-height:2.1;color:var(--text);padding:22px 18px;margin:4px -6px 24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.lang-toggle{display:flex;width:fit-content;margin:0 auto 22px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:3px;gap:2px}
.lang-toggle button{border:none;background:transparent;color:var(--text-muted);padding:7px 20px;border-radius:99px;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.lang-toggle button.active{background:var(--sage);color:#fff}
.lang-toggle button:not(.active):hover{color:var(--sage-deep)}
.lang-toggle button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.hadis-fn{margin-top:22px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
.hadis-fn-item{font-size:calc(var(--hadis-fs,17px) - 3px);line-height:1.7;color:var(--text-muted);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-weight:300;text-indent:-14px;padding-left:14px}
.hadis-fn-star{color:var(--sage);font-weight:700;margin-right:3px}
.hadis-num-inline{display:block;text-align:center;font-weight:600;color:var(--sage-deep);letter-spacing:.18em;margin-bottom:28px;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-size:13px;text-transform:uppercase;position:relative}
.hadis-num-inline::before,.hadis-num-inline::after{content:'';position:absolute;top:50%;width:50px;height:1px;opacity:.7}
.hadis-num-inline::before{left:50%;margin-left:-110px;background:linear-gradient(90deg,transparent,var(--border))}
.hadis-num-inline::after{left:50%;margin-left:60px;background:linear-gradient(90deg,var(--border),transparent)}
.hadis-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.hadis-tb-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);height:38px;min-width:38px;padding:0 14px;border-radius:99px;cursor:pointer;font-size:13px;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent;transition:all .25s}
.hadis-tb-btn:hover,.hadis-tb-btn:active{border-color:var(--sage);color:var(--sage-deep);background:var(--surface2)}
.hadis-tb-btn.copied,.hadis-tb-btn.active{border-color:var(--sage);color:var(--sage-deep);background:var(--sage-glow)}
.hadis-tb-btn:disabled{opacity:.55;cursor:wait}
.hadis-tb-group{display:inline-flex;border:1px solid var(--border);border-radius:99px;overflow:hidden;background:var(--surface)}
.hadis-tb-group .hadis-tb-btn{border:none;border-radius:0;background:transparent;height:36px;min-width:38px;border-right:1px solid var(--border)}
.hadis-tb-group .hadis-tb-btn:last-child{border-right:none}
.hadis-tb-group .hadis-tb-btn:hover,.hadis-tb-group .hadis-tb-btn:active{background:var(--sage-glow);color:var(--sage-deep)}
.hadis-ref{color:var(--sage-deep);text-decoration:none;border-bottom:1px dashed var(--sage);cursor:pointer;transition:color .25s,border-color .25s,background .25s;padding:0 3px;border-radius:3px;font-style:italic}
.hadis-ref:hover,.hadis-ref:active{color:var(--text);border-bottom-color:var(--sage-deep);background:var(--sage-glow)}
.hadis-narrator,.hadis-source{margin-top:14px;padding:16px 18px;background:var(--surface);border-radius:var(--radius);font-size:13px;line-height:1.75;color:var(--text-dim);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-style:italic;font-weight:300;position:relative}
.hadis-narrator{border-left:3px solid var(--sage)}
.hadis-source{border-left:3px solid var(--rose-soft)}
.hadis-narrator strong,.hadis-source strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-muted);margin-bottom:6px;font-style:normal;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif}
.kitob-izoh{margin-bottom:22px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--sage);border-radius:var(--radius);font-size:13px;line-height:1.75;color:var(--text-dim);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-weight:300}
.kitob-izoh-star{color:var(--sage);font-weight:700;margin-right:4px}
.muallaqot-block{margin-bottom:24px;padding:18px 20px;background:var(--surface);border-radius:var(--radius);border-left:3px solid var(--rose-soft)}
.muallaqot-label{font-size:10px;color:var(--rose-soft);letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:7px;font-weight:600}
.muallaqot-label::before{content:"⚑";font-size:13px}
.muallaqot-text{font-size:13px;line-height:1.85;color:var(--text-dim);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-weight:300}
.bob-muallaqot-badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;color:var(--rose-soft);margin-left:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
/* Search results page */
.search-pg-header{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.search-pg-title{font-size:18px;color:var(--text);margin-bottom:6px;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-weight:400}
.search-pg-meta{font-size:11px;color:var(--text-muted);letter-spacing:.05em}
.result-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow-sm);transition:transform .35s var(--ease),box-shadow .35s,background .25s;content-visibility:auto;contain-intrinsic-size:auto 90px}
.result-item:hover,.result-item:active{transform:translateY(-1px);box-shadow:var(--shadow);background:var(--surface3)}
.result-label{font-size:10px;color:var(--sage-deep);margin-bottom:6px;line-height:1.6;letter-spacing:.04em;font-weight:500}
.result-text{font-size:14px;line-height:1.7;color:var(--text-dim);font-weight:300}
.result-text mark{background:var(--sage-glow);color:var(--text);border-radius:3px;padding:1px 4px;font-weight:500}
.result-text.arab{font-family:system-ui,'Geeza Pro',sans-serif;font-size:17px;line-height:1.9}
.hadis-xrefs{margin-top:14px;padding:12px 14px;background:var(--surface);border-radius:8px;font-size:14px;line-height:1.9;color:var(--text-dim)}
.hadis-xrefs strong{color:var(--text);font-weight:500;margin-right:6px}
.xref-link{display:inline-block;padding:2px 9px;margin:2px 3px 2px 0;background:var(--bg);border:1px solid var(--border);border-radius:14px;color:var(--accent);font-weight:500;text-decoration:none;font-size:13px}
.xref-link:hover{background:var(--sage-glow);color:var(--text)}
.no-results{text-align:center;padding:60px 20px;color:var(--text-muted)}
.no-results-icon{font-size:52px;margin-bottom:18px;opacity:.4}
.result-section{margin-bottom:28px}
.result-section-header{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--text-muted);margin-bottom:12px;padding:0 4px 8px;border-bottom:1px solid var(--border);font-weight:500}
.result-where{font-size:9px;color:var(--rose-soft);text-transform:uppercase;letter-spacing:.12em;margin-left:8px;padding:2px 7px;background:rgba(184,138,130,.12);border-radius:99px;font-weight:600}
.result-more-btn{display:block;width:100%;background:var(--surface);border:1px solid var(--border);color:var(--sage-deep);padding:14px;border-radius:var(--radius);cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-size:13px;font-weight:500;margin-top:10px;-webkit-tap-highlight-color:transparent;transition:all .25s}
.result-more-btn:hover,.result-more-btn:active{border-color:var(--sage);background:var(--sage-glow)}
/* PDF юклаб олиш */
.pdf-download{margin-top:28px;padding-top:24px;border-top:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pdf-btn{display:inline-flex;align-items:center;gap:8px;background:var(--sage-glow);border:1px solid var(--sage);color:var(--sage-deep);padding:12px 22px;border-radius:99px;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-size:14px;font-weight:500;-webkit-tap-highlight-color:transparent;transition:all .2s}
.pdf-btn:hover,.pdf-btn:active{background:var(--sage);color:#fff}
.pdf-note{font-size:11px;color:var(--text-muted)}
.pdf-dl{color:var(--sage-deep);text-decoration:none;font-weight:500;-webkit-tap-highlight-color:transparent}
.pdf-dl:hover,.pdf-dl:active{text-decoration:underline}
/* Recent searches */
.recent-searches{margin-bottom:24px}
.recent-searches[hidden]{display:none}
.recent-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.recent-label{font-size:11px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}
.recent-clear{background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;padding:2px 4px}
.recent-clear:hover,.recent-clear:active{color:var(--sage-deep)}
.recent-chips{display:flex;flex-wrap:wrap;gap:8px}
.recent-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 13px;border-radius:99px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-size:13px;-webkit-tap-highlight-color:transparent;transition:all .2s}
.recent-chip:hover,.recent-chip:active{border-color:var(--sage);background:var(--sage-glow)}
/* Search result filter tabs */
.search-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.search-filter-tab{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:7px 14px;border-radius:99px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-size:12.5px;font-weight:500;-webkit-tap-highlight-color:transparent;transition:all .2s}
.search-filter-tab:hover{border-color:var(--sage)}
.search-filter-tab.active{background:var(--sage);border-color:var(--sage);color:#fff}
.kitob-card:focus-visible,.bob-card:focus-visible,.hadis-item:focus-visible,.result-item:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
/* Floating action buttons */
.scroll-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;background:var(--surface);border:1px solid var(--border);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:18px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .35s,transform .25s,background .25s,color .25s;z-index:50;box-shadow:var(--shadow)}
.scroll-top.visible{opacity:1;pointer-events:auto}
.scroll-top:hover,.scroll-top:active{background:var(--sage);color:#fff;transform:scale(.95)}
.fab-theme{position:fixed;bottom:24px;left:24px;width:46px;height:46px;background:var(--surface);border:1px solid var(--border);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform .35s var(--ease),opacity .35s,background .25s;z-index:50;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow)}
.fab-theme:hover,.fab-theme:active{background:var(--surface2);transform:scale(.95) rotate(15deg)}
.fab-nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;background:var(--surface);border:1px solid var(--border);border-radius:99px;overflow:hidden;z-index:50;box-shadow:var(--shadow);transition:transform .35s var(--ease),opacity .35s}
.fab-nav button{background:transparent;border:none;color:var(--text-dim);width:58px;height:46px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:color .25s,background .25s;-webkit-tap-highlight-color:transparent}
.fab-nav button:hover,.fab-nav button:active{color:var(--sage-deep);background:var(--sage-glow)}
.fab-nav button.disabled{opacity:.3;pointer-events:none}
.fab-nav button + button{border-left:1px solid var(--border)}

/* FAB ларни автоматик яшириш (пастга скролл қилганда) */
body.fabs-hidden .fab-theme,body.fabs-hidden .scroll-top{transform:translateY(90px) !important;opacity:0;pointer-events:none}
body.fabs-hidden .fab-nav{transform:translateX(-50%) translateY(90px);opacity:0;pointer-events:none}

/* Page transitions */
.page{display:none;opacity:0;transition:opacity .35s var(--ease);background:var(--bg);height:100vh;overflow-y:auto;position:fixed;top:0;left:0;right:0;bottom:0;overscroll-behavior:contain}
.page.visible{display:block;opacity:1}
#pgHome{display:block;opacity:1}

/* Update banner */
.update-banner{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--sage);border-radius:99px;padding:8px 8px 8px 18px;box-shadow:var(--shadow-lg);z-index:60;max-width:calc(100vw - 32px);animation:slideUpBanner .35s var(--ease)}
.update-banner.visible{display:flex}
.update-banner span{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap}
.update-banner button.update-btn{background:var(--sage);color:#fff;border:none;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;letter-spacing:.02em;transition:background .25s}
.update-banner button.update-btn:hover,.update-banner button.update-btn:active{background:var(--sage-deep)}
.update-banner button.update-dismiss{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:0 6px;line-height:1;transition:color .25s}
.update-banner button.update-dismiss:hover{color:var(--text)}
@keyframes slideUpBanner{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translateX(-50%)}}
body.fabs-hidden .update-banner{transform:translate(-50%,90px);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .35s}
.install-banner{position:fixed;left:16px;right:16px;bottom:16px;max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:var(--shadow-lg);z-index:65;animation:installSlideUp .4s var(--ease)}
.install-banner[hidden]{display:none}
.install-banner-icon{width:44px;height:44px;border-radius:10px;flex-shrink:0;object-fit:cover}
.install-banner-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.install-banner-text strong{font-size:14px;font-weight:600;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;letter-spacing:.005em}
.install-banner-text p{font-size:12px;color:var(--text-dim);margin:0;line-height:1.4;font-weight:400}
#install-banner-action{background:var(--sage);color:#fff;border:none;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;letter-spacing:.02em;transition:background .25s,transform .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
#install-banner-action:hover,#install-banner-action:active{background:var(--sage-deep);transform:translateY(-1px)}
#install-banner-close{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:6px;line-height:1;transition:color .25s;-webkit-tap-highlight-color:transparent;flex-shrink:0}
#install-banner-close:hover,#install-banner-close:active{color:var(--text)}
body.fabs-hidden .install-banner{transform:translateY(120%);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .35s}
@keyframes installSlideUp{from{transform:translateY(120%);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:480px){
  .install-banner{padding:10px 10px 10px 12px;gap:10px;bottom:12px;left:12px;right:12px}
  .install-banner-icon{width:40px;height:40px}
  .install-banner-text strong{font-size:13px}
  .install-banner-text p{font-size:11px}
  #install-banner-action{padding:8px 13px;font-size:12px}
}

/* Loading state */
.loading-state{text-align:center;padding:50px 20px;color:var(--text-muted);font-size:13px;letter-spacing:.06em;font-weight:300}
.loading-state::before{content:"";display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--sage);border-radius:50%;animation:spin .9s linear infinite;vertical-align:middle;margin-right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:480px){
  .home-hero{padding:42px 18px 32px}
  .home-title{font-size:25px}
  .grid-wrap{padding:28px 14px 130px}
}
.hadis-stub-note{padding:14px 16px;margin:0 0 22px;background:var(--surface);border-left:3px solid var(--rose-soft);border-radius:var(--radius-sm);color:var(--text-dim);font-size:13px;line-height:1.6;font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;font-style:italic}
.hadis-arab-stub{display:block !important;margin-top:14px}
.hadis-stub-badge{display:inline-block;font-size:9px;color:var(--rose-soft);background:rgba(184,138,130,.12);padding:2px 7px;border-radius:99px;margin-left:8px;text-transform:none;letter-spacing:.05em;font-weight:600;font-style:italic}
.hadis-item-preview-ar{font-family:system-ui,'Geeza Pro',sans-serif;font-size:16px;line-height:1.85;color:var(--text-dim)}
</style>

<script>
// Енгил китоб метамаълумоти HTML га инлайн қилинган — бош саҳифа дарҳол кўрсатилади
const BOOKS = JSON.parse(document.getElementById('books-data').textContent);
// PDF юклаб олиш — файллар GitHub Releases'да ('pdf' тег) сақланади
const PDF_BASE = 'https://github.com/abuyahyo/buxoriy/releases/download/pdf/';
let DB = []; // дастлаб index.json (метамаълумот), сўнг data.json (тўлиқ)
let isFullDB = false;
let indexPromise = null;
let fullDataPromise = null;

let ST = { page:'home', kid:null, bid:null, hid:null };
const scrollPos = {};
let lastHash = '';
// localStorage хавфсиз ўровчилари (private mode / quota хатоликларидан ҳимоя)
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
let th = lsGet('th') || 'dark';
let fs = parseInt(lsGet('fs'),10) || 16;
document.documentElement.style.setProperty('--hadis-fs',fs+'px');

function apTh(){
  document.documentElement.className=th;
  lsSet('th',th);
  const fab=document.getElementById('fabTheme');
  if(fab) fab.textContent = th==='dark' ? '☀️' : '🌙';
}

function getK(kid){ return DB.find(k=>k.id===kid); }
function getB(kid,bid){ const k=getK(kid); return k&&k.boblar.find(b=>b.id===bid); }
function getH(kid,bid,hid){ const b=getB(kid,bid); return b&&b.hadislar.find(h=>h.id===hid); }

function allH(){
  const a=[];
  DB.forEach(k=>k.boblar.forEach(b=>b.hadislar.forEach(h=>a.push({kid:k.id,bid:b.id,h}))));
  return a;
}

// Ҳадис рақамлари → {kid, bid} (cross-reference линклар учун)
let HADIS_MAP = null;
function buildHadisMap(){
  if(HADIS_MAP || !isFullDB) return;
  HADIS_MAP = new Map();
  DB.forEach(k=>k.boblar.forEach(b=>b.hadislar.forEach(h=>{
    HADIS_MAP.set(h.id, {kid:k.id, bid:b.id});
  })));
}

// Матндаги "N-ҳадис", "N ҳадисга" каби ҳаволаларни босиладиган линкка айлантириш
function linkifyRefs(html){
  if(!isFullDB) return html;
  buildHadisMap();
  return html.replace(/(\d+)([\s-]+)(ҳадис|Ҳадис|ҲАДИС)([\u0400-\u04ff]*)/g, (match, num, sep, word, suffix)=>{
    const target = HADIS_MAP.get(parseInt(num, 10));
    if(!target) return match;
    return `<a class="hadis-ref" href="#k/${target.kid}/b/${target.bid}/h/${num}" onclick="event.stopPropagation()">${num}${sep}${word}${suffix}</a>`;
  });
}

// Атраф (crossrefs.json) — кичкина файл (~9 КБ), ҳадис очилганида юкланади
let XREFS = null, xrefsPromise = null;
function loadXrefs(){
  if(XREFS) return Promise.resolve(XREFS);
  if(!xrefsPromise) xrefsPromise = fetch('crossrefs.json')
    .then(r=>r.ok ? r.json() : {})
    .then(d=>{ XREFS=d; return d; })
    .catch(()=>{ XREFS={}; return {}; });
  return xrefsPromise;
}

// Арабча матн (arabic.json) — «Арабча» тугмаси ёки арабча қидирувда юкланади.
const ARABIC_ENABLED = true;
let ARAB = null, ARAB_NORM = null, arabPromise = null;
// ─── Кўп ёзувли «кечиримли» нормализация ───────────────────────────────────
// Кирилл → лотин канон. «ҳаққ» ва «haqq» бир хил калитга айланади, шунинг учун
// фойдаланувчи қайси ёзувда ёзса ҳам бир хил натижа топилади.
const _CYR = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'x','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'i','ь':'','э':'e','ю':'yu','я':'ya','ў':'o','ғ':'g','қ':'q','ҳ':'h'};
const _APO = /['’‘ʻʼ`´]/;                              // апострофлар (o'→o, g'→g — юмшоқлик)
const _TASHKEEL = /[ً-ٰٟـ]/;        // ҳаракат + татвиҳ
const _HARAKAT  = /[ً-ٰٟ]/;              // фақат ҳаракат (татвиҳсиз)
const _hasHarakat = s => _HARAKAT.test(s);
const _isWordCh = c => /[\p{L}\p{N}]/u.test(c);

// Нормаллашган сатр + позиция харитаси (map[i] = норм-белги i нинг асл индекси).
// mode 'ar' — арабча (ҳаракатсиз, ҳарф фолдинг); акс ҳолда ўзбекча (кирилл↔лотин).
function buildNormMap(orig, mode){
  let norm='', map=[];
  if(mode==='ar'){
    for(let i=0;i<orig.length;i++){
      const c=orig[i];
      if(_TASHKEEL.test(c)) continue;                  // ҳаракат/татвиҳ — асл матнда қолади, нормда йўқ
      let r=c;
      if(c==='آ'||c==='أ'||c==='إ') r='ا';      // آأإ → ا
      else if(c==='ى') r='ي';                            // ى → ي
      else if(c==='ة') r='ه';                            // ة → ه
      else if(c==='ؤ'||c==='ئ') r='و';              // ؤئ → و
      norm+=r; map.push(i);
    }
  } else {
    for(let i=0;i<orig.length;i++){
      const lc=orig[i].toLowerCase();
      for(let k=0;k<lc.length;k++){
        const ch=lc[k];
        if(_APO.test(ch)) continue;
        const r=(ch in _CYR)?_CYR[ch]:ch;
        for(let j=0;j<r.length;j++){ norm+=r[j]; map.push(i); }
      }
    }
  }
  return {norm, map};
}
function normUz(s){ return buildNormMap(String(s),'uz').norm; }
function normArab(s){ return buildNormMap(String(s),'ar').norm; }       // юмшоқ (ҳаракатсиз)
// Аниқ даража: ҳарфларни фолдинг, лекин ҳаракатни сақлаш (фойдаланувчи ҳаракат ёзса)
function normArabKeep(s){
  return String(s).replace(/ـ/g,'')
    .replace(/[آأإ]/g,'ا').replace(/ى/g,'ي')
    .replace(/ة/g,'ه').replace(/[ؤئ]/g,'و');
}

// Сўз-чегарали мослик: поз=0 ёки олдинги белги ҳарф/рақам эмас. \b кирилл/арабда
// ишламагани учун чегарани ўзимиз аниқлаймиз. arab=true → «ال» артикли ихтиёрий.
function _boundaryOk(norm, idx, arab){
  if(idx===0 || !_isWordCh(norm[idx-1])) return true;
  if(arab && idx>=2 && norm.substr(idx-2,2)==='ال'
     && (idx-2===0 || !_isWordCh(norm[idx-3]))) return true;  // ал+сўз
  return false;
}
function firstMatch(norm, q, arab){           // early-exit (матчинг учун)
  if(!q) return -1;
  let from=0, idx;
  while((idx=norm.indexOf(q,from))!==-1){
    if(_boundaryOk(norm,idx,arab)) return idx;
    from=idx+1;
  }
  return -1;
}
function allMatches(norm, q, arab){           // барча мосликлар (highlight учун)
  const res=[]; if(!q) return res;
  let from=0, idx;
  while((idx=norm.indexOf(q,from))!==-1){
    if(_boundaryOk(norm,idx,arab)) res.push(idx);
    from=idx+1;
  }
  return res;
}

// Топилган сўзни асл матнга позиция-харита орқали <mark> билан ажратиб, парча қайтаради.
// HTML esc қилинади — ажратиш ҳеч қачон HTML ни бузмайди.
function renderSnippet(origRaw, q, mode, maxLen){
  maxLen = maxLen || 200;
  const orig = String(origRaw).replace(/\s+/g,' ').trim();
  const arab = mode==='ar';
  const {norm, map} = buildNormMap(orig, mode);
  const starts = allMatches(norm, q, arab);
  const ranges = starts.map(ns=>{
    const ne = ns + q.length;
    return [ map[ns], ne < map.length ? map[ne] : orig.length ];
  });
  let winStart=0, winEnd=orig.length, pre='', suf='';
  if(orig.length > maxLen){
    if(ranges.length){                                // парчани топилган сўз атрофидан
      const before=Math.floor((maxLen - q.length)/2);
      winStart=Math.max(0, ranges[0][0]-before);
      winEnd=Math.min(orig.length, winStart+maxLen);
      if(winEnd-winStart<maxLen && winStart>0) winStart=Math.max(0, winEnd-maxLen);
    } else { winEnd=maxLen; }
    if(winStart>0) pre='…';
    if(winEnd<orig.length) suf='…';
  }
  ranges.sort((a,b)=>a[0]-b[0]);
  let html='', i=winStart;
  for(const [os,oe] of ranges){
    const s=Math.max(os,winStart), e=Math.min(oe,winEnd);
    if(e<=i) continue;
    if(s>i) html+=escHtml(orig.slice(i,s));
    html+='<mark>'+escHtml(orig.slice(Math.max(s,i),e))+'</mark>';
    i=e;
  }
  if(i<winEnd) html+=escHtml(orig.slice(i,winEnd));
  return pre+html+suf;
}

// Матндаги "* ..." изоҳ параграфларини (жойидан қатъи назар) асосий матндан ажратиш
function splitFootnotes(matn){

  matn.split('\n\n').forEach(p => {

}

function fmtBobTitle(rest){
  rest = rest.toLowerCase();
  return rest.replace(/(^|[.?!»«(]\s*)([а-яёҳқғўҚҒЎҲa-z])/g, (match, before, letter) => before + letter.toUpperCase()).replace(/(\s)Деган(\s)/g, '$1деган$2').replace(/набий/g, 'Набий').replace(/(?<!солла)аллоҳ(?!\s*у\s*алайҳи)/g, 'Аллоҳ').replace(/муҳаммад/g, 'Муҳаммад');
}
function bobNomi(nomi){
  // Каноник бирлаштирилган боблар: "3-БОБ // 4-БОБ" -> "3–4-БОБ"
  if(nomi.indexOf(' // ') !== -1){
    const nums=[], titles=[];
    nomi.split(' // ').forEach(p=>{
      const mm = p.match(/^\s*(\d+)\s*-\s*[Бб][Оо][Бб]\.?\s*([\s\S]*)$/);
      if(mm){
        nums.push(+mm[1]);
        const t = mm[2].trim().replace(/^\(такрорий\)\.?\s*/i,'').trim();
        if(t) titles.push(t);
      }
    });
    if(nums.length){
      const nl = (nums.length===2 && nums[1]===nums[0]+1) ? nums[0]+'–'+nums[1] : nums.join(', ');
      let r = nl + '-БОБ';
      if(titles.length){ let ft = fmtBobTitle(titles.join('. ')); if(!/[.?!…»]$/.test(ft)) ft += '.'; r += '. ' + ft; }
      return r;
    }
  }
  const m = nomi.match(/^(\d+-[Бб][Оо][Бб]\.?\s*)([\s\S]*)/);
  if(!m) return nomi;
  const prefix = m[1].toUpperCase();
  const restFormatted = fmtBobTitle(m[2]);
  if(!/[.?!…»]$/.test(restFormatted)) return prefix + restFormatted + '.';
  return prefix + restFormatted;
}

function bc(containerId, items){
  const el=document.getElementById(containerId);
  const last = items[items.length-1];
  const lastIsTrail = !!last.fn;
  const trail = lastIsTrail ? items : items.slice(0,-1);
  const cur = lastIsTrail ? null : last;
  const trailHtml = trail.map((it, i) => {
    const sepAfter = (i < trail.length - 1 || cur) ? '<span class="bc-sep">›</span>' : '';
    return `<span class="bc-link" onclick="${it.fn}">${it.t}</span>${sepAfter}`;
  }).join('');
  const curHtml = cur ? `<span class="bc-cur">${cur.t}</span>` : '';
  el.innerHTML=`<div class="bc-trail">${trailHtml}</div>${curHtml}`;
}

function setHash(h){
  const target = h ? '#'+h : location.pathname+location.search;
  if(location.hash !== (h?'#'+h:'') ) history.pushState(null, '', target);
}

// Legacy URL redirect: before the 2026-06 canonical alignment the Uzbek site
// had 98 kitabs. UZ-86 and UZ-87 (Ҳаддлар + муҳориблар) were both fragments of
// canonical kitab 86 (الحدود). Merging them shifted everything from UZ-88 down
// by one. Old bookmarks and shared links land here and are remapped in place.
function migrateLegacyHash(h){
  const m = h.match(/^k\/(\d+)(?:\/b\/(\d+)(?:\/h\/(\d+))?)?$/);
  if(!m) return null;
  let kid = +m[1], bid = m[2] ? +m[2] : null, hid = m[3] ? +m[3] : null;
  const orig = `k/${kid}${bid?'/b/'+bid:''}${hid?'/h/'+hid:''}`;
  // UZ-87 bobs moved into UZ-86 with a +15 offset (UZ-86 had 15 bobs originally)
  if(kid === 87){
    kid = 86;
    if(bid !== null) bid += 15;
  } else if(kid >= 88 && kid <= 98){
    kid -= 1;
  } else {
    return null;
  }
  const next = `k/${kid}${bid?'/b/'+bid:''}${hid?'/h/'+hid:''}`;
  return next === orig ? null : next;
}

function applyHash(){
  const h = location.hash.slice(1);
  if(h.startsWith('q=')){
    const q = decodeURIComponent(h.slice(2));
    document.getElementById('searchInput').value = q;
    updateSearchUI();
    App.goHome(true);
    App.doSearch(q, true);
    return;
  }
  const migrated = migrateLegacyHash(h);
  if(migrated){
    history.replaceState(null, '', '#' + migrated);
    return applyHash();
  }
  const m = h.match(/^k\/(\d+)(?:\/b\/(\d+)(?:\/h\/(\d+))?)?$/);
  if(!m){ App.goHome(); return; }
  const kid=+m[1], bid=m[2]?+m[2]:null, hid=m[3]?+m[3]:null;
  if(hid) App.openHadis(kid,bid,hid);
  else if(bid) App.openBob(kid,bid);
  else App.openKitob(kid);
}

function escHtml(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function syncSearchToHash(q){
  const newHash = q ? '#q=' + encodeURIComponent(q) : '';
  const cur = location.hash;
  if(cur === newHash) return;
  const newUrl = newHash ? newHash : location.pathname + location.search;
  if(cur.startsWith('#q=')) history.replaceState(null, '', newUrl);
  else history.pushState(null, '', newUrl);
}

  async _buildShareImages(h,k,b){
    const isLight=document.documentElement.classList.contains('light');
    const C=isLight?{
      bgFrom:'#faf3e7',bgTo:'#efe5cb',
      text:'#2a2218',textDim:'#5a4d3e',textMuted:'#8a7d68',
      accent:'#a87a2c',divider:'rgba(168,122,44,.3)'
    }:{
      bgFrom:'#1f1a16',bgTo:'#342c26',
      text:'#f5ecdb',textDim:'#b8a890',textMuted:'#8a7c68',
      accent:'#d9b870',divider:'rgba(217,184,112,.25)'
    };
    const W=1080,H=1080,PAD=80;
    const bodyFont="-apple-system, system-ui, sans-serif";
    const uiFont="-apple-system, system-ui, sans-serif";
    const bodyFs=34, bodyLh=Math.round(bodyFs*1.7);
    const maxBodyW=W-PAD*2;
    const ctxLabel=k&&b?`${k.nomi} · ${b.id}-боб`:'';
    const m=document.createElement('canvas'); m.width=W; m.height=H;
    const mctx=m.getContext('2d');
    mctx.font=`300 ${bodyFs}px ${bodyFont}`;
    const lines=this._wrapShareText(mctx,h.matn,maxBodyW);
    const headerBottom=PAD+(ctxLabel?92:70);
    const footerHeight=h.rowi?180:70;
    const bodyTop=headerBottom+20;
    const bodyBottom=H-PAD-footerHeight;
    const linesPerSlide=Math.max(1,Math.floor((bodyBottom-bodyTop)/bodyLh));
    const slides=this._splitShareSlides(lines,linesPerSlide);
    if(!slides.length) slides.push(['']);
    const total=slides.length;
    const files=[];
    for(let i=0;i<total;i++){
      const blob=await this._renderShareSlide({
        lines:slides[i],idx:i+1,total,h,ctxLabel,C,W,H,PAD,
        bodyFont,uiFont,bodyFs,bodyLh,bodyTop
      });
      const suffix=total>1?`-${i+1}`:'';
      files.push(new File([blob],`hadis-${h.id}${suffix}.png`,{type:'image/png'}));
    }
    return files;
  },
  _splitShareSlides(lines,capacity){
    if(lines.length<=capacity) return [lines];
    const slides=[];
    let i=0;
    while(i<lines.length){
      const remaining=lines.length-i;
      if(remaining<=capacity){ slides.push(lines.slice(i)); break; }
      const minSplit=Math.max(1,Math.floor(capacity*0.65));
      let cut=capacity;
      for(let j=capacity;j>=minSplit;j--){
        if(lines[i+j]===''){ cut=j; break; }
      }
      if(cut===capacity){
        for(let j=capacity;j>=minSplit;j--){
          const ln=lines[i+j-1]||'';
          if(/[.!?»][\s)]*$/.test(ln)){ cut=j; break; }
        }
      }
      slides.push(lines.slice(i,i+cut));
      i+=cut;
      while(i<lines.length&&lines[i]==='') i++;
    }
    return slides;
  },
  _wrapShareText(ctx,text,maxWidth){
    const lines=[];
    const segments=String(text||'').split('\n');
    segments.forEach(seg=>{
      if(!seg.trim()){ lines.push(''); return; }
      const words=seg.split(/\s+/);
      let cur='';
      for(const w of words){
        const test=cur?cur+' '+w:w;
        if(ctx.measureText(test).width>maxWidth&&cur){
          lines.push(cur); cur=w;
        }else{
          cur=test;
        }
      }
      if(cur) lines.push(cur);
    });
    return lines;
  },
  _renderShareSlide(opt){
    const {lines,idx,total,h,ctxLabel,C,W,H,PAD,bodyFont,uiFont,bodyFs,bodyLh,bodyTop}=opt;
    const self=this;
    return new Promise(resolve=>{
      const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      const ctx=cv.getContext('2d');
      const grad=ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0,C.bgFrom); grad.addColorStop(1,C.bgTo);
      ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=C.accent; ctx.fillRect(PAD,PAD,50,3);
      let headY=PAD+16;
      if(ctxLabel){
        ctx.fillStyle=C.textMuted;
        ctx.font=`500 15px ${uiFont}`;
        ctx.textAlign='left'; ctx.textBaseline='top';
        let label=ctxLabel;
        while(ctx.measureText(label).width>W-PAD*2&&label.length>4){
          label=label.slice(0,-2);
          if(!label.endsWith('…')) label=label.slice(0,-1)+'…';
        }
        ctx.fillText(label,PAD,headY);
        headY=PAD+42;
      }
      ctx.fillStyle=C.accent;
      ctx.font=`600 22px ${uiFont}`;
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText(`${h.id}-ҲАДИС`,PAD,headY);
      if(total>1){
        ctx.fillStyle=C.textMuted;
        ctx.font=`500 18px ${uiFont}`;
        ctx.textAlign='right';
        ctx.fillText(`${idx} / ${total}`,W-PAD,headY+2);
      }
      ctx.fillStyle=C.text;
      ctx.font=`300 ${bodyFs}px ${bodyFont}`;
      ctx.textAlign='left'; ctx.textBaseline='top';
      const bodyBottom=H-PAD-(h.rowi?180:70);
      const bodyAvail=bodyBottom-bodyTop;
      const bodyUsed=lines.length*bodyLh;
      let y=bodyTop+Math.max(0,(bodyAvail-bodyUsed)/2);
      for(const line of lines){
        ctx.fillText(line,PAD,y);
        y+=bodyLh;
      }
      if(h.rowi){
        const fy=H-PAD-160;
        ctx.fillStyle=C.divider;
        ctx.fillRect(PAD,fy,60,1);
        ctx.fillStyle=C.textMuted;
        ctx.font=`600 11px ${uiFont}`;
        ctx.textAlign='left';
        ctx.fillText('РИВОЯТИ',PAD,fy+14);
        ctx.fillStyle=C.textDim;
        ctx.font=`italic 300 22px ${bodyFont}`;
        const rowiLines=self._wrapShareText(ctx,h.rowi,W-PAD*2);
        const maxRowiLines=3;
        const show=rowiLines.slice(0,maxRowiLines);
        if(rowiLines.length>maxRowiLines&&show.length){
          show[show.length-1]=show[show.length-1].replace(/.{3}$/,'…');
        }
        let ry=fy+40;
        for(const rl of show){ ctx.fillText(rl,PAD,ry); ry+=32; }
      }
      ctx.fillStyle=C.textMuted;
      ctx.font=`600 13px ${uiFont}`;
      ctx.textAlign='center';
      ctx.fillText('САҲИҲ БУХОРИЙ',W/2,H-PAD-6);
      cv.toBlob(b=>resolve(b),'image/png');
    });
  },
  doSearch(v, fromHash){
    const trimmed = v.trim();
    const kView = document.getElementById('kitoblarView');
    const sView = document.getElementById('searchView');

    if(!fromHash) syncSearchToHash(trimmed);

    if(!trimmed){
      sView.style.display='none';
      kView.style.display='';
      _searchState = { query:'', kitob:[], bob:[], hadis:[], hadisShown:0 };
      showRecentSearches();
      return;
    }

    if(!isFullDB){
      kView.style.display='none';
      sView.style.display='';
      document.getElementById('searchMeta').textContent='';
      document.getElementById('searchResults').innerHTML='<div class="loading-state">Маълумот юкланмоқда…</div>';
      fullDataPromise.then(()=>App.doSearch(v, fromHash)).catch(()=>{});
      return;
    }

    const isArab = isArabicQuery(trimmed);
    if(isArab && !ARAB){
      kView.style.display='none';
      sView.style.display='';
      document.getElementById('searchMeta').textContent='';
      document.getElementById('searchResults').innerHTML='<div class="loading-state">Арабча матн юкланмоқда…</div>';
      loadArab().then(()=>App.doSearch(v, fromHash))
        .catch(()=>{ document.getElementById('searchResults').innerHTML='<div class="no-results"><p>Арабча матнни юклаб бўлмади</p></div>'; });
      return;
    }

    buildSearchIndex();
    const isNum = /^\d+$/.test(trimmed);
    const qNorm = isArab ? normArab(trimmed) : normUz(trimmed);
    const kitob=[], bob=[], hadis=[];

    if(isNum){
      // Рақам бўйича — ҳадис id
      SIDX.hadis.forEach(e=>{ if(String(e.h.id)===trimmed) hadis.push({k:e.k, b:e.b, h:e.h, where:'matn'}); });
    } else if(isArab){
      // Арабча: юмшоқ (ҳаракатсиз) даража; сўровда ҳаракат бўлса — аниқ даража фильтри
      const keep = _hasHarakat(trimmed) ? normArabKeep(trimmed) : null;
      SIDX.hadis.forEach(e=>{
        const an = ARAB_NORM[e.h.id];
        if(!an || firstMatch(an, qNorm, true)===-1) return;
        if(keep && !normArabKeep(ARAB[e.h.id] || '').includes(keep)) return;
        hadis.push({k:e.k, b:e.b, h:e.h, where:'arabic'});
      });
    } else {
      // Ўзбекча (кирилл↔лотин), сўз-чегарали — тайёр калитлар бўйича
      SIDX.books.forEach(e=>{ if(firstMatch(e.n, qNorm)!==-1) kitob.push({k:e.k}); });
      SIDX.bobs.forEach(e=>{
        const inN=firstMatch(e.n,qNorm)!==-1, inI=e.i&&firstMatch(e.i,qNorm)!==-1, inM=e.m&&firstMatch(e.m,qNorm)!==-1;
        if(inN||inI||inM) bob.push({k:e.k, b:e.b, where: inN?'nomi':inI?'izoh':'muallaqot'});
      });
      SIDX.hadis.forEach(e=>{
        const inM=firstMatch(e.m,qNorm)!==-1, inR=e.r&&firstMatch(e.r,qNorm)!==-1, inI=e.i&&firstMatch(e.i,qNorm)!==-1;
        if(inM||inR||inI) hadis.push({k:e.k, b:e.b, h:e.h, where: inM?'matn':inR?'rowi':'izoh'});
      });
    }

    _searchState = { query:trimmed, qNorm, kitob, bob, hadis, hadisShown: Math.min(SEARCH_HADIS_PAGE, hadis.length), filter:'all', isArab };
    this._renderSearch();
    kView.style.display='none';
    sView.style.display='';
  },

  setFilter(f){ _searchState.filter = f; this._renderSearch(); },

  openFromSearch(type, kid, bid, hid){
    saveRecentSearch(_searchState.query);
    if(type==='k') this.openKitob(kid);
    else if(type==='b') this.openBob(kid, bid);
    else this.openHadis(kid, bid, hid);
  },

  _renderSearch(){
    const s = _searchState;
    const total = s.kitob.length + s.bob.length + s.hadis.length;
    document.getElementById('searchMeta').textContent = total ? total+' та натижа' : '';
    const filtersEl = document.getElementById('searchFilters');
    const container = document.getElementById('searchResults');
    if(!total){
      filtersEl.innerHTML='';
      container.innerHTML='<div class="no-results"><div class="no-results-icon">🔍</div><p>Натижа топилмади</p></div>';
      return;
    }
    const f = s.filter || 'all';
    // Филтр таблари — фақат натижа бор бўлимлар кўрсатилади
    const tabs = [['all','Ҳаммаси',total],['kitob','Китоблар',s.kitob.length],['bob','Боблар',s.bob.length],['hadis','Ҳадислар',s.hadis.length]];
    filtersEl.innerHTML = tabs.filter(([k,,n])=>k==='all'||n).map(([k,lbl,n])=>
      `<button class="search-filter-tab${f===k?' active':''}" onclick="App.setFilter('${k}')">${lbl} ${n}</button>`).join('');
    // Highlight нормаллашган сўров устида амалга ошади, лекин позиция-харита орқали
    // АСЛ матн ҳарфларига боғланади (renderSnippet ичида).
    const q = s.qNorm;
    let html='';

    if(s.kitob.length && (f==='all'||f==='kitob')){
      html += `<div class="result-section"><div class="result-section-header">Китоблар (${s.kitob.length})</div>`;
      html += s.kitob.map(({k})=>`<div class="result-item" role="button" tabindex="0" onclick="App.openFromSearch('k',${k.id})"><div class="result-label">${k.id}-китоб</div><div class="result-text">${renderSnippet(k.nomi, q, 'uz', 9999)}</div></div>`).join('');
      html += '</div>';
    }

    if(s.bob.length && (f==='all'||f==='bob')){
      html += `<div class="result-section"><div class="result-section-header">Боблар (${s.bob.length})</div>`;
      html += s.bob.map(({k,b,where})=>{
        // Боб номини дисплей форматида (bobNomi) кўрсатамиз — хом маълумотда касе
        // нотўғри бўлиши мумкин; илованинг қолган жойларидек нормаллаштирилади.
        const txt = where==='nomi' ? bobNomi(b.nomi) : where==='izoh' ? b.izoh : b.muallaqot;
        const lbl = where==='izoh' ? 'Изоҳда' : where==='muallaqot' ? 'Муаллақотда' : '';
        return `<div class="result-item" role="button" tabindex="0" onclick="App.openFromSearch('b',${k.id},${b.id})"><div class="result-label">${escHtml(k.nomi)} › ${b.id}-боб${lbl?' <span class="result-where">'+lbl+'</span>':''}</div><div class="result-text">${renderSnippet(txt, q, 'uz')}</div></div>`;
      }).join('');
      html += '</div>';
    }

    if(s.hadis.length && (f==='all'||f==='hadis')){
      const shown = s.hadis.slice(0, s.hadisShown);
      html += `<div class="result-section"><div class="result-section-header">Ҳадислар (${s.hadis.length})</div>`;
      html += shown.map(({k,b,h,where})=>{
        if(where==='arabic'){
          // Highlight ҳаракатли АСЛ матнга тушади (нормаллашган эмас) — позиция-харита орқали
          const arabOrig = (ARAB && ARAB[h.id]) || (ARAB_NORM && ARAB_NORM[h.id]) || '';
          return `<div class="result-item" role="button" tabindex="0" onclick="App.openFromSearch('h',${k.id},${b.id},${h.id})"><div class="result-label">${escHtml(k.nomi)} › ${b.id}-боб › ${h.id}-ҳадис <span class="result-where">Арабча</span></div><div class="result-text arab" dir="rtl">${renderSnippet(arabOrig, q, 'ar')}</div></div>`;
        }
        const txt = where==='matn' ? h.matn : where==='rowi' ? h.rowi : h.izoh;
        const lbl = where==='rowi' ? 'Ровийда' : where==='izoh' ? 'Изоҳда' : '';
        return `<div class="result-item" role="button" tabindex="0" onclick="App.openFromSearch('h',${k.id},${b.id},${h.id})"><div class="result-label">${escHtml(k.nomi)} › ${b.id}-боб › ${h.id}-ҳадис${lbl?' <span class="result-where">'+lbl+'</span>':''}</div><div class="result-text">${renderSnippet(txt, q, 'uz')}</div></div>`;
      }).join('');
      if(s.hadisShown < s.hadis.length){
        html += `<button class="result-more-btn" onclick="App.showMoreHadis()">Яна кўрсатиш (${s.hadis.length - s.hadisShown} та қолди)</button>`;
      }
      html += '</div>';
    }

    container.innerHTML = html;
  },

  showMoreHadis(){
    _searchState.hadisShown = Math.min(_searchState.hadisShown + SEARCH_HADIS_PAGE, _searchState.hadis.length);
    this._renderSearch();
  },

  restoreSearch(){
    if(!_searchState.query){ this.goHome(); return; }
    ST = {page:'home',kid:null,bid:null,hid:null};
    document.getElementById('searchInput').value = _searchState.query;
    updateSearchUI();
    syncSearchToHash(_searchState.query);
    this._renderSearch();
    document.getElementById('kitoblarView').style.display='none';
    document.getElementById('searchView').style.display='';
    showPage('pgHome');
  }
};

// --- Сўнгги қидирувлар (localStorage) ---
const RECENT_KEY = 'recent-searches', RECENT_MAX = 8;
function getRecentSearches(){ try{ return JSON.parse(lsGet(RECENT_KEY)||'[]'); }catch(e){ return []; } }
function saveRecentSearch(q){
  q = (q||'').trim();
  if(q.length < 2) return;
  let list = getRecentSearches().filter(x=>x.toLowerCase()!==q.toLowerCase());
  list.unshift(q);
  list = list.slice(0, RECENT_MAX);
  lsSet(RECENT_KEY, JSON.stringify(list));
  renderRecentSearches();
}
function clearRecentSearches(){ lsDel(RECENT_KEY); renderRecentSearches(); hideRecentSearches(); searchInput && searchInput.focus(); }
function renderRecentSearches(){
  const el = document.getElementById('recentSearches');
  if(!el) return;
  const list = getRecentSearches();
  el.innerHTML = list.length ? (`<div class="recent-head"><span class="recent-label">Сўнгги қидирувлар</span><button class="recent-clear" onclick="clearRecentSearches()">Тозалаш</button></div>`+
    `<div class="recent-chips">`+list.map((q,i)=>`<button class="recent-chip" onclick="runRecentSearch(${i})">${escHtml(q)}</button>`).join('')+`</div>`) : '';
}
// Сўнгги қидирувлар фақат қидирув майдони фокусланганда ва бўш бўлганда кўринади
function showRecentSearches(){
  const el = document.getElementById('recentSearches');
  if(!el) return;
  if(document.activeElement===searchInput && !searchInput.value && getRecentSearches().length){
    renderRecentSearches(); el.hidden = false;
  } else { el.hidden = true; }
}
function hideRecentSearches(){ const el = document.getElementById('recentSearches'); if(el) el.hidden = true; }
function runRecentSearch(i){
  const q = getRecentSearches()[i];
  if(q==null) return;
  searchInput.value = q;
  updateSearchUI();
  App.doSearch(q);
}

// Клавиатура: role="button" карталарни Enter/Space билан фаоллаштириш
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const t=e.target;
  if(t && t.getAttribute && t.getAttribute('role')==='button' && t.tagName!=='BUTTON' && t.tagName!=='A'){
    e.preventDefault();
    t.click();
  }
});

let sT;
const searchInput = document.getElementById('searchInput');
const searchWrap = document.querySelector('.home-search .search-wrap');
function updateSearchUI(){ searchWrap.classList.toggle('has-text', !!searchInput.value); }
searchInput.addEventListener('focus',showRecentSearches);
searchInput.addEventListener('blur',()=>setTimeout(hideRecentSearches,180));
searchInput.addEventListener('input',e=>{
  updateSearchUI();
  if(e.target.value) hideRecentSearches();          // ёзаётганда яшир
  clearTimeout(sT); sT=setTimeout(()=>App.doSearch(e.target.value),300);
});
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ clearTimeout(sT); App.doSearch(searchInput.value); saveRecentSearch(searchInput.value); searchInput.blur(); }
});
document.getElementById('searchClear').addEventListener('click',()=>{
  searchInput.value='';
  updateSearchUI();
  clearTimeout(sT);
  App.doSearch('');
  searchInput.focus();
  showRecentSearches();
});
let _lastScrollY = 0, _scrollTicking = false;
function _handleFabVisibility(scrollTop){
  if(_scrollTicking) return;
  _scrollTicking = true;
  requestAnimationFrame(()=>{
    const delta = scrollTop - _lastScrollY;
    if(scrollTop < 60) document.body.classList.remove('fabs-hidden');
    else if(delta > 12) document.body.classList.add('fabs-hidden');
    else if(delta < -6) document.body.classList.remove('fabs-hidden');
    _lastScrollY = scrollTop;
    _scrollTicking = false;
  });
}
['pgHome','pgBob','pgHadisList','hadisPage'].forEach(pageId=>{
  const el = document.getElementById(pageId);
  el.addEventListener('scroll',()=>{
    document.getElementById('scrollTop').className='scroll-top'+(el.scrollTop>400?' visible':'');
    _handleFabVisibility(el.scrollTop);
  });
});
document.getElementById('scrollTop').onclick=()=>{
  const pageIdMap={home:'pgHome',bob:'pgBob',hadisList:'pgHadisList',hadis:'hadisPage'};
  const curId=pageIdMap[ST.page]||'pgHome';
  document.getElementById(curId).scrollTo({top:0,behavior:'smooth'});
};

window.addEventListener('hashchange', applyHash);

// Аввал орқа фонда юклашни бошлаймиз — preload билан биргаликда HTML парсингидан

// Service Worker — PWA, офлайн, янгилаш огоҳлантириши
let _swRegistration = null;
let _swWaiting = null;
function showSwBanner(){
  if(lsGet('sw-dismissed-this-update') === _swCurrentBuild()) return;
  document.getElementById('updateBanner').classList.add('visible');
}
function _swCurrentBuild(){
  return _swWaiting ? _swWaiting.scriptURL : '';
}
function applySwUpdate(){
  document.getElementById('updateBanner').classList.remove('visible');
  if(_swWaiting){
    _swWaiting.postMessage('skip-waiting');
    navigator.serviceWorker.addEventListener('controllerchange', ()=>location.reload(), {once:true});
  } else {
    location.reload();
  }
}
function dismissSwUpdate(){
  document.getElementById('updateBanner').classList.remove('visible');
  // Бу версия учун қайта кўрсатмаслик
  if(_swWaiting) lsSet('sw-dismissed-this-update', _swCurrentBuild());
}
// PWA install banner
const INSTALL_DISMISS_KEY = 'buxoriy_install_dismissed_at';
const INSTALL_DISMISS_TTL = 14 * 24 * 60 * 60 * 1000;
let deferredInstallPrompt = null;
const installBanner = document.getElementById('install-banner');
const installAction = document.getElementById('install-banner-action');
const installClose = document.getElementById('install-banner-close');
function isInstallDismissed(){
  const t = Number(lsGet(INSTALL_DISMISS_KEY) || 0);
  return t && (Date.now() - t < INSTALL_DISMISS_TTL);
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}
function showInstallBanner(){
  if(!installBanner || isStandalone() || isInstallDismissed()) return;
  installBanner.hidden = false;
}
function hideInstallBanner(){ if(installBanner) installBanner.hidden = true; }
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  hideInstallBanner();
});
installAction && installAction.addEventListener('click', async ()=>{
  if(!deferredInstallPrompt){ hideInstallBanner(); return; }
  hideInstallBanner();
  try{
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
  }catch(_){}
  deferredInstallPrompt = null;
});
installClose && installClose.addEventListener('click', ()=>{
  lsSet(INSTALL_DISMISS_KEY, String(Date.now()));
  hideInstallBanner();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      _swRegistration = reg;
      // Already waiting (deploy happened while previous tab was open)
      if(reg.waiting && navigator.serviceWorker.controller){
        _swWaiting = reg.waiting;
        showSwBanner();
      }
      reg.addEventListener('updatefound', ()=>{
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener('statechange', ()=>{
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            _swWaiting = newWorker;
            showSwBanner();
          }
        });
      });
    }).catch(()=>{/* SW ишламаса ҳам сайт ишлайди */});
    // Фойдаланувчи табга қайтганда янги версия текширилади
    document.addEventListener('visibilitychange', ()=>{
      if(!document.hidden && _swRegistration) _swRegistration.update().catch(()=>{});
    });
  });
}
